name: Bug report
description: Report a reproducible problem with Storm Codex
body:
  - type: markdown
    attributes:
      value: Do not include credentials or private replays. Use the private reporting link for security issues.
  - type: input
    id: setup
    attributes:
      label: Version, OS and setup
      description: Include the version or commit, and whether this is the Windows app or Docker.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce and what happened
      description: Say what you expected, what happened, and include only redacted logs.
    validations:
      required: true
