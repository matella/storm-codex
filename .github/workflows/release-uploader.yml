# Uploader installer release (docs/spec/09-operations.md, "Releasing the uploader").
# Tag `uploader-v<X.Y.Z>` (must equal `version` in uploader/Cargo.toml): builds the Windows installer
# (plain cargo build, NO SERVER_URL/AUTH_TOKEN set so nothing personal is baked into the published
# binary — unlike the local `uploader/build-uploader.ps1 -Installer` convenience script, which bakes
# in whatever is in the caller's own uploader/.env for a personal build) and publishes it as a
# GitHub Release, explicitly NOT marked "latest" (`--latest=false`): this repo's "latest" release is
# the desktop app (its updater and the download page both resolve `/releases/latest`; see
# desktop/tauri.conf.json and scripts/build-pages.py).
# Unlike the desktop app, this uploader has no signed auto-update manifest: `updater.rs` only shows
# a clickable "update available" link (it lists releases and filters for `uploader-v*` tags itself,
# so it never reads "latest" either).
# Manual run (workflow_dispatch): same build, published to the fixed draft tag `uploader-main-auto`
# (never `uploader-v*`, never "latest") — mirrors auto-draft-desktop.yml's pattern. Refuses to touch
# that tag if it's somehow not a draft, then deletes+recreates it, so it never accumulates or
# collides with a real release. The dry run; delete it when you're done inspecting it.
name: release-uploader
on:
  push:
    tags: ["uploader-v*"]
  workflow_dispatch: {}
permissions:
  contents: write # create the release and upload its asset (GITHUB_TOKEN)
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
      - name: resolve version and tag
        run: |
          $cargoVersion = (Select-String -Path uploader/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            "RELEASE_TAG=uploader-main-auto" >> $env:GITHUB_ENV
            "IS_DRY_RUN=true" >> $env:GITHUB_ENV
          } else {
            $tag = $env:GITHUB_REF_NAME -replace '^uploader-v', ''
            if ($tag -ne $cargoVersion) {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match uploader/Cargo.toml version $cargoVersion"
              exit 1
            }
            "RELEASE_TAG=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV
            "IS_DRY_RUN=false" >> $env:GITHUB_ENV
          }
          "CARGO_VERSION=$cargoVersion" >> $env:GITHUB_ENV
      - name: dry run — refuse to clobber a non-draft uploader-main-auto
        if: env.IS_DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh release list` (not `gh release view <tag>`) so a confirmed-empty/no-match result
          # (exit 0) is distinguishable from a real lookup failure (exit nonzero: network, auth,
          # rate limit) — the latter must stop the job, not be silently treated as "not found".
          $listJson = gh release list --repo matella/storm-codex --json tagName,isDraft --limit 200 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "gh release list failed — cannot safely check for an existing uploader-main-auto draft."
            exit 1
          }
          $existing = ($listJson | ConvertFrom-Json) | Where-Object { $_.tagName -eq "uploader-main-auto" } | Select-Object -First 1
          if ($existing) {
            if (-not $existing.isDraft) {
              Write-Error "uploader-main-auto exists and is NOT a draft — refusing to touch it."
              exit 1
            }
            # No --cleanup-tag: a draft can exist without a pushed git ref for its tag name, and
            # gh would then fail deleting a ref that isn't there, aborting before recreation. The
            # tag name is just reused (and its ref updated) by the next `gh release create` below.
            gh release delete uploader-main-auto --repo matella/storm-codex --yes
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to delete the existing uploader-main-auto draft."
              exit 1
            }
          }
      - name: build (release, no SERVER_URL/AUTH_TOKEN — public, unconfigured binary)
        run: cargo build --release --manifest-path uploader/Cargo.toml
        env:
          SERVER_URL: ""
          AUTH_TOKEN: ""
      - name: install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" uploader/installer.iss
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem uploader/installer-output/*.exe | Select-Object -First 1
          $ghArgs = @(
            "release", "create", "$env:RELEASE_TAG", $installer.FullName,
            "--repo", "matella/storm-codex",
            "--title", "Uploader $env:CARGO_VERSION",
            "--notes", "Heroes of the Storm replay uploader. Unconfigured build — set your server URL and upload token in Settings on first run.",
            "--latest=false"
          )
          if ($env:IS_DRY_RUN -eq "true") { $ghArgs += "--draft" }
          gh @ghArgs
