# Desktop installer release (docs/spec/09-operations.md, "Releasing the desktop app").
# - Tag `desktop-v<X.Y.Z>` (must equal `version` in desktop/tauri.conf.json): builds the signed NSIS installer and
#   publishes it, its `.sig` and the updater manifest `latest.json` as the repository's **latest** GitHub Release
#   (installed apps read releases/latest/download/latest.json).
# - Manual run (workflow_dispatch): same build, published as a **draft** release (never "latest", invisible to
#   installed apps): the dry run. Delete the draft afterwards.
# Fails on purpose while desktop/referential-pin.txt or the updater public key are placeholders, or when the signing
# secret is missing. Tools are pinned: tauri-cli (cargo install --locked --force), Trunk (prebuilt, SHA-256 committed
# below), the Rust toolchain version; NSIS is downloaded by the Tauri bundler itself.
# Supply-chain rules of this job (it holds contents:write and the updater signing key): every action is pinned to a
# full commit SHA (version in a comment); no build cache is restored (no rust-cache: a restored ~/.cargo/bin or
# target/ could plant a cargo-tauri or a build output); checkout does not persist the token; event values reach
# scripts through env, never by expression interpolation inside `run:`.
name: release-desktop
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch: {}
permissions:
  contents: write # create the release and upload its assets (GITHUB_TOKEN)
concurrency:
  group: release-desktop
  cancel-in-progress: false
env:
  TAURI_CLI_VERSION: "2.12.4"
  TRUNK_VERSION: "0.22.0-beta.1" # same as the Dockerfile
  # SHA-256 of trunk-x86_64-pc-windows-msvc.zip v0.22.0-beta.1 (10,270,358 bytes), computed on download 2026-11-14.
  # Change it together with TRUNK_VERSION.
  TRUNK_SHA256: "5324764f6a7d130753e9087e3713a8c3398d7c4cef2985a698042de91b8d3f51"
  RUST_TOOLCHAIN: "1.94.0" # the toolchain the release build is checked with locally
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the contents:write token stays out of .git/config (gh gets it via GH_TOKEN)
      - name: version (tag = desktop/tauri.conf.json)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "tauri.conf.json version '$version' is not X.Y.Z" }
          if ($env:EVENT_NAME -eq 'push') {
            $tag = $env:REF_NAME
            if ($tag -ne "desktop-v$version") { throw "tag $tag does not match tauri.conf.json version $version (expected desktop-v$version)" }
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=desktop-v$version" >> $env:GITHUB_ENV
      - name: refuse placeholders (updater public key, signing secret)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $pubkey = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if (-not $pubkey -or $pubkey.StartsWith('PLACEHOLDER')) {
            throw "plugins.updater.pubkey in desktop/tauri.conf.json is still a placeholder: generate the key pair (cargo tauri signer generate) and commit the public key"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "repository secret TAURI_SIGNING_PRIVATE_KEY is not set" }
      - name: reference-data snapshot (pinned, SHA-256 checked)
        run: ./scripts/fetch-referential.ps1
      # Also copies the VC++ runtime DLLs the EDB binaries import into postgres/bin (from the runner's Visual Studio
      # redistributable folder) and fails unless every bin/ and lib/ binary finds them there (check-pe-imports.ps1).
      - name: Postgres 17 binaries (pinned, SHA-256 checked) + VC++ runtime (app-local)
        run: ./scripts/fetch-postgres.ps1
      # Pinned to the commit of the action's `stable` branch tip on 2026-11-14 (b725eda, committed 2026-10-16); the
      # toolchain itself is pinned by `toolchain:` (the branch name only selects the action's default).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: install Trunk (pinned prebuilt, committed SHA-256)
        run: |
          if ($env:TRUNK_SHA256 -notmatch '^[0-9a-f]{64}$') { throw "TRUNK_SHA256 is missing or not 64 lowercase hex characters" }
          $url = "https://github.com/trunk-rs/trunk/releases/download/v$env:TRUNK_VERSION/trunk-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'trunk.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TRUNK_SHA256) { throw "trunk.zip SHA-256 mismatch: expected $env:TRUNK_SHA256, actual $actual" }
          $dir = Join-Path $env:RUNNER_TEMP 'trunk'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $dir >> $env:GITHUB_PATH
      - name: install tauri-cli (pinned)
        run: cargo install tauri-cli --version $env:TAURI_CLI_VERSION --locked --force
      - name: web bundles (overlay, sources, app → web-rs/dist)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($b in 'overlay', 'sources', 'app') {
            Push-Location "web-rs/$b"
            trunk build --release
            Pop-Location
          }
      # Static CRT: a clean Windows install has no VC++ redistributable and the per-user installer cannot add one.
      # Scoped to this step (RUSTFLAGS), so local and CI dev builds keep the default dynamic CRT; the shell already
      # links it statically (tauri-build static_vcruntime).
      - name: server (release, static CRT)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p storm-codex-server
      - name: bundled binaries find their VC++ runtime (server imports none)
        run: |
          ./scripts/check-pe-imports.ps1 -Path target/release/storm-codex-server.exe -List
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/check-pe-imports.ps1 -Path target/postgres/bin, target/postgres/lib -ResolveDir target/postgres/bin
      - name: installer (tauri build, signed)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # tauri.bundle.conf.json turns bundling on and adds the resources (kept out of tauri.conf.json because
        # tauri-build copies resources on every cargo build and fails when they are missing).
        run: cargo tauri build --config tauri.bundle.conf.json
      - name: release assets (installer, .sig, latest.json)
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          $setup = @(Get-ChildItem desktop/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "expected exactly one NSIS installer, found $($setup.Count)" }
          $sigFile = "$($setup[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $sigFile)) { throw "missing updater signature $sigFile" }
          # A name without spaces: GitHub rewrites spaces in asset names, the URL below must match exactly.
          $name = "StormCodex_$($env:VERSION)_x64-setup.exe"
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item -LiteralPath $setup[0].FullName -Destination "out/$name"
          Copy-Item -LiteralPath $sigFile -Destination "out/$name.sig"
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = "Storm Codex $($env:VERSION)"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                # the .sig file's content, not a path or URL
                signature = (Get-Content -LiteralPath $sigFile -Raw).Trim()
                url       = "https://github.com/$($env:REPOSITORY)/releases/download/$($env:TAG)/$name"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath out/latest.json -Encoding utf8NoBOM
          $mb = [math]::Round((Get-Item "out/$name").Length / 1MB, 1)
          "Installer ``$name``: $mb MB" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem out | Format-Table Name, Length
      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $files = (Get-ChildItem out).FullName
          if ($env:EVENT_NAME -eq 'push') {
            gh release create $env:TAG @files --verify-tag --latest --title "Storm Codex $($env:VERSION)" --notes "Windows installer: StormCodex_$($env:VERSION)_x64-setup.exe. Installed apps update themselves."
          } else {
            gh release create $env:TAG @files --draft --target $env:COMMIT_SHA --title "Storm Codex $($env:VERSION) (dry run)" --notes "Dry run from a manual workflow run: a draft, never served to installed apps. Delete it after checking."
          }
