# CI de qualité : format + migrations figées, clippy strict + tests Rust (avec Postgres de service
# → les tests d'intégration DB-gated tournent réellement), audit des dépendances, tests & build
# front. L'image ghcr.io n'est publiée (job `publish`) qu'après le succès de tous ces jobs.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # le contrôle des migrations compare à la base
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: format (cargo fmt)
        run: cargo fmt --all -- --check
      - name: migrations existantes inchangées
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sh scripts/check-migrations.sh "origin/${{ github.base_ref }}"
          else
            sh scripts/check-migrations.sh "${{ github.event.before }}"
          fi
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: storm
          POSTGRES_PASSWORD: storm
          POSTGRES_DB: storm_codex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storm -d storm_codex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://storm:storm@localhost:5432/storm_codex
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests (unitaires + intégration DB)
        run: cargo test --workspace
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec)
        run: cargo audit
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: audit (dépendances embarquées dans le bundle)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: tests (vitest)
        run: npm test
        working-directory: web
      - name: build (tsc + vite)
        run: npm run build
        working-directory: web
  # Image storm-codex sur ghcr.io : seulement sur push (main ou tag v*), seulement si tout est vert.
  # Tags : `latest` (main), `sha-<commit>` (retour arrière possible), et le nom du tag git.
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [checks, rust, audit, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push vers ghcr.io (GITHUB_TOKEN suffit)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          img=ghcr.io/matella/storm-codex
          tags="$img:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then tags="$tags,$img:latest"; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tags="$tags,$img:${GITHUB_REF_NAME}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
