# Quality CI: format + frozen migrations, strict clippy + Rust tests (with a service Postgres
# → the DB-gated integration tests really run), dependency audit, front-end tests & build.
# The ghcr.io image is only published (`publish` job) after all these jobs succeed.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migrations check compares against the base
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: format (cargo fmt)
        run: cargo fmt --all -- --check
      - name: existing migrations unchanged
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sh scripts/check-migrations.sh "origin/${{ github.base_ref }}"
          else
            sh scripts/check-migrations.sh "${{ github.event.before }}"
          fi
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: storm
          POSTGRES_PASSWORD: storm
          POSTGRES_DB: storm_codex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storm -d storm_codex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://storm:storm@localhost:5432/storm_codex
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests (unit + DB integration)
        run: cargo test --workspace
  # Standalone desktop app (Windows): the Tauri shell (desktop/, own Cargo.lock, outside the workspace) and the
  # real-Postgres tests of the supervisor and the shell. Those need the bundled Postgres 17 binaries (PG_BIN_DIR):
  # in the `rust` job they skip (supervisor) or stay ignored. Not a `publish` gate (the image does not ship them).
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - uses: actions/cache@v4.3.0
        id: pg
        with:
          path: ${{ runner.temp }}\postgres
          key: postgres-${{ hashFiles('desktop/postgres-pin.txt') }}
      - name: Postgres 17 binaries (pinned, SHA-256 checked; cached per pin)
        if: steps.pg.outputs.cache-hit != 'true'
        run: ./scripts/fetch-postgres.ps1 -Destination "$env:RUNNER_TEMP\postgres"
      - name: format (desktop)
        run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - name: clippy (desktop, strict)
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
      - name: tests (desktop, real Postgres included)
        run: cargo test --manifest-path desktop/Cargo.toml -- --include-ignored
        env:
          PG_BIN_DIR: ${{ runner.temp }}\postgres\bin
      - name: tests (supervisor, real Postgres included)
        run: cargo test -p storm-codex-supervisor -- --include-ignored
        env:
          PG_BIN_DIR: ${{ runner.temp }}\postgres\bin
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec)
        run: cargo audit
  # Rust front-end (web-rs, Leptos → wasm): the only front-end; `publish` waits for it.
  web-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-rs
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: "clippy (native, core)"
        run: cargo clippy --all-targets -- -D warnings
        working-directory: web-rs
      - name: "clippy (wasm32, every crate)"
        run: cargo clippy --target wasm32-unknown-unknown --workspace -- -D warnings
        working-directory: web-rs
      - name: tests (core)
        run: cargo test
        working-directory: web-rs
      - name: build the overlay bundle (trunk)
        run: trunk build --release
        working-directory: web-rs/overlay
      - name: build the sources bundle (trunk)
        run: trunk build --release
        working-directory: web-rs/sources
      - name: build the app bundle (trunk)
        run: trunk build --release
        working-directory: web-rs/app
      - name: size budget (overlay <= 300 kB gzip)
        run: sh scripts/check-web-rs-size.sh web-rs/dist/overlay 300000
      - name: size budget (sources <= 300 kB gzip)
        run: sh scripts/check-web-rs-size.sh web-rs/dist/sources 300000
      - name: size budget (app <= 1 MB brotli)
        run: |
          sudo apt-get install -y brotli
          SIZE_CODEC=br sh scripts/check-web-rs-size.sh web-rs/dist/app 1000000
  # storm-codex image on ghcr.io: only on push (main or tag v*), only if everything is green.
  # Tags: `latest` (main), `sha-<commit>` (rollback possible), and the git tag name.
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [checks, rust, audit, web-rs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io (GITHUB_TOKEN is enough)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          img=ghcr.io/matella/storm-codex
          tags="$img:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then tags="$tags,$img:latest"; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tags="$tags,$img:${GITHUB_REF_NAME}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
