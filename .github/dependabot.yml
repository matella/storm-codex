version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/desktop", "/web-rs"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: "/tools/parity-harness"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      parity-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
