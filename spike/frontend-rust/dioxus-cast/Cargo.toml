[package]
name = "dioxus-cast"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde_json = "1.0.154"
spike-common = { path = "../common" }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["HtmlElement", "Window", "Document"] }
