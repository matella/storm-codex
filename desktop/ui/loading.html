<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storm Codex</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1426; color: #c9d6f0;
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .04em; color: #e8f0ff; }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #24345a;
    border-top-color: #78c8ff; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  p { margin: 0; font-size: 13px; color: #8a9bc0; }
</style>
</head>
<body>
  <h1>Storm Codex</h1>
  <div class="spin" role="progressbar" aria-label="Starting"></div>
  <p>Starting the database and the server...</p>
</body>
</html>
