<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A3: dark chrome before WASM paints (blank-frame colour-scheme); A23: theme colour + description. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070b" />
    <meta name="description" content="Storm Codex: local-first Heroes of the Storm replay stats, session dashboard, scouting reports and OBS overlays." />
    <title>Storm Codex</title>
    <link data-trunk rel="icon" href="../../desktop/icons/32x32.png" />
    <!-- The asset base (Trunk.toml) is shared by root and /v2/ pages, including deep links. -->
    <link rel="preload" as="font" type="font/woff2" href="/v2/app/fonts/figtree-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/v2/app/fonts/big-shoulders-display-latin-800-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/v2/app/fonts/big-shoulders-display-latin-900-normal.woff2" crossorigin />
    <link data-trunk rel="css" href="fonts.css" />
    <link data-trunk rel="css" href="theme.css" />
    <link data-trunk rel="css" href="ds.css" />
    <link data-trunk rel="css" href="cast.css" />
    <link data-trunk rel="css" href="overlay-builder.css" />
    <link data-trunk rel="copy-dir" href="fonts" />
    <!-- wasm-opt 123 (bundled with trunk) rejects what rustc emits unless these features are enabled -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z"
          data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
