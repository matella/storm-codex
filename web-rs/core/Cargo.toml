[package]
name = "storm-web-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "Framework-neutral core of the Rust front-end: wire models, pure logic, browser I/O (wasm only)."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "websocket", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "ResizeObserver", "ResizeObserverEntry"] }
wasm-bindgen = "0.2"
