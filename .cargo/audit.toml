# `cargo audit` configuration (CI `audit` job).
[advisories]
ignore = [
  # rsa (Marvin Attack): no fix published. The crate is only in Cargo.lock (pulled in by
  # sqlx-mysql) and is compiled for no target: `cargo tree -i rsa --target all` is empty.
  # Remove as soon as a fix exists or the crate leaves the lockfile.
  "RUSTSEC-2023-0071",
  # libsqlite3-sys (C SQLite CVE-2026-119375): the fix is libsqlite3-sys >= 0.39.
  # Same case as rsa: only in Cargo.lock (pulled in by sqlx-sqlite) and compiled for no target:
  # `cargo tree -i libsqlite3-sys --target all` is empty. sqlx 0.9 still caps libsqlite3-sys below
  # 0.38 (checked 2026-11-10): remove once a sqlx release allows >= 0.39.
  "RUSTSEC-2026-0459",
]
