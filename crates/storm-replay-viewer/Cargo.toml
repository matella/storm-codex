[package]
name = "storm-replay-viewer"
description = "Projection d'un replay décodé en géométrie normalisée pour la visionneuse 2D"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
storm-replay = { version = "0.1", path = "../storm-replay" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
