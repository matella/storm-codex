[package]
name = "storm-stats"
version = "0.1.0"
description = "Heroes of the Storm match stats from a decoded replay — port of hots-parser"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# version + path: path for local dev, version for the crates.io publication (milestone 6 —
# storm-stats is published after storm-replay).
storm-replay = { version = "0.1", path = "../storm-replay" }
# preserve_order: JS objects are ordered by insertion — the `for..in` over
# non-numeric keys (Warhead Junction nukes…) must follow that order, not the sorted order.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
mimalloc = { version = "0.1", optional = true }

[features]
fast-alloc = ["dep:mimalloc"]

[dev-dependencies]
anyhow = "1"

[lints]
workspace = true
