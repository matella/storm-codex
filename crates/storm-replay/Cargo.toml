[package]
name = "storm-replay"
version = "0.1.0"
description = "Heroes of the Storm replay decoder (.StormReplay) — MPQ + Blizzard protocols"
keywords = ["heroes-of-the-storm", "replay", "parser", "blizzard"]
categories = ["parser-implementations", "games"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nom-mpq = "2"
serde_json = "1"
thiserror = "2"
mimalloc = { version = "0.1", optional = true }

[features]
# mimalloc allocator for the binaries (decoding = bursts of small allocations;
# the default Windows heap costs ~10-15% of the decoding time). The server (milestone 3)
# will enable it too.
fast-alloc = ["dep:mimalloc"]

[dev-dependencies]
anyhow = "1"

[lints]
workspace = true
