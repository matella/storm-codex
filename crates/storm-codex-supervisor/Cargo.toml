[package]
name = "storm-codex-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Process supervision helpers for the standalone Storm Codex installer"

[dependencies]
fs4 = "0.13"
# CSPRNG for the generated Postgres password.
getrandom = "0.3"
# Process listing for stale `postmaster.pid` detection (process feature only).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
thiserror = "2"

# Paths for Postgres' narrow-char tools (short names, code-page check, private junction
# folder); same version the desktop shell already uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
