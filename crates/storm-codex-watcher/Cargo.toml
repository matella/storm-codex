[package]
name = "storm-codex-watcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Replay folder detection, upload ledger, backfill and live watch for the standalone Storm Codex installer"

[dependencies]
# Documents known folder (follows OneDrive relocation on Windows).
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt", "sync", "time", "macros"] }
tracing = "0.1"
# Same blocking HTTP client as the server and client-rs; run under spawn_blocking.
ureq = "3"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
