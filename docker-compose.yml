# storm-codex production deployment (box). Dedicated Postgres + the server (front-end included).
# Non-invasive deployment: new ports, reads HotsPatchNotes read-only, DOES NOT TOUCH the
# Jarvis Redis or the overlay while `REDIS_URL`/`AZURE_*` are not set (push = opt-in,
# best-effort, absent = no emission). The actual switchover (see runbook) sets these variables.
#
# Box: rsync the repo → `docker compose up -d --build`. Secrets in the box's .env (never committed).
services:
  postgres:
    image: postgres:17
    container_name: storm-codex-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: storm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storm}
      POSTGRES_DB: storm_codex
    volumes:
      - storm-codex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storm -d storm_codex"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Once per start: /data belongs to the server's non-root user (uid 10001).
  # Needed for a volume created by an older image that ran as root; no effect otherwise.
  storm-codex-init:
    image: busybox:1.37
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - storm-codex-data:/data
    restart: "no"

  server:
    build: .
    container_name: storm-codex-server
    restart: unless-stopped
    # `docker stop`: SIGTERM → in-flight requests finish (clean shutdown), then SIGKILL after this delay.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      storm-codex-init:
        condition: service_completed_successfully
    ports:
      - "${STORM_CODEX_PORT:-8088}:8088"
    environment:
      # unique container name (not the 'postgres' alias: it collides with jarvis-postgres
      # on the shared jarvis_default network).
      DATABASE_URL: postgres://storm:${POSTGRES_PASSWORD:-storm}@storm-codex-pg:5432/storm_codex
      # empty/absent = open mode (local self-hosting); set = admin auth by Bearer.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # hero/talent reference data (read-only) — HotsPatchNotes on the box host
      HOTSPATCHNOTES_URL: ${HOTSPATCHNOTES_URL:-http://host.docker.internal:5001}
      # opt-in push (empty at initial deployment; set at switchover)
      REDIS_URL: ${REDIS_URL:-}
      JARVIS_CHANNEL: ${JARVIS_CHANNEL:-storm-codex:match_completed}
      AZURE_PUSH_URL: ${AZURE_PUSH_URL:-}
      AZURE_PUSH_TOKEN: ${AZURE_PUSH_TOKEN:-}
      RAW_CACHE_MAX_BYTES: ${RAW_CACHE_MAX_BYTES:-5368709120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      # Jarvis network (external): lets the match event be published on jarvis-redis.
      # Only enabled if present; non-invasive (storm-codex only PUBLISHes a dedicated channel).
      - jarvis
    volumes:
      - storm-codex-data:/data

networks:
  default:
  jarvis:
    external: true
    name: jarvis_default

volumes:
  storm-codex-pgdata:
  storm-codex-data:
