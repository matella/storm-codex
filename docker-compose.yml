# storm-codex production deployment (box). Dedicated Postgres + the server (front-end included).
# Non-invasive deployment: new ports, reads the HotsPatchNotes dataset releases, DOES NOT TOUCH the
# overlay while `AZURE_*` is not set (push = opt-in, best-effort, absent = no emission).
# The actual switchover (see runbook) sets this variable.
#
# Box: rsync the repo → `docker compose up -d --build`. Secrets in the box's .env (never committed).
services:
  postgres:
    image: postgres:17
    container_name: storm-codex-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: storm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storm}
      POSTGRES_DB: storm_codex
    volumes:
      - storm-codex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storm -d storm_codex"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Once per start: /data belongs to the server's non-root user (uid 10001).
  # Needed for a volume created by an older image that ran as root; no effect otherwise.
  storm-codex-init:
    image: busybox:1.37
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - storm-codex-data:/data
    restart: "no"

  server:
    build: .
    container_name: storm-codex-server
    restart: unless-stopped
    # `docker stop`: SIGTERM → in-flight requests finish (clean shutdown), then SIGKILL after this delay.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      storm-codex-init:
        condition: service_completed_successfully
    ports:
      - "${STORM_CODEX_PORT:-8088}:8088"
    environment:
      # unique container name (not the 'postgres' alias, to avoid colliding with another
      # Postgres container on the host network).
      DATABASE_URL: postgres://storm:${POSTGRES_PASSWORD:-storm}@storm-codex-pg:5432/storm_codex
      # empty/absent = open mode (local self-hosting); set = admin auth by Bearer.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # hero/talent/map/patch reference data: HotsPatchNotes dataset releases (schema v1), verified, every 24 h.
      # Default = the producer's latest release; empty = no refresh.
      REFDATA_URL: ${REFDATA_URL:-https://github.com/matella/HeroesOfTheStormPatchNotes/releases/latest/download/}
      # opt-in push (empty at initial deployment; set at switchover)
      AZURE_PUSH_URL: ${AZURE_PUSH_URL:-}
      AZURE_PUSH_TOKEN: ${AZURE_PUSH_TOKEN:-}
      RAW_CACHE_MAX_BYTES: ${RAW_CACHE_MAX_BYTES:-5368709120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    volumes:
      - storm-codex-data:/data

networks:
  default:

volumes:
  storm-codex-pgdata:
  storm-codex-data:
