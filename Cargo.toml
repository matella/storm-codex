[workspace]
resolver = "2"
members = ["crates/storm-replay", "crates/storm-stats", "crates/storm-codex-server", "crates/storm-replay-viewer", "crates/storm-lobby"]
# The milestone 0 spike is frozen (its own lockfile) — it is not part of the workspace.
exclude = ["spike/storm-decode"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/matella/storm-codex"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

# Perf budgets = contracts (CLAUDE.md): decoding is the server's hot path.
[profile.release]
lto = "thin"
codegen-units = 1
