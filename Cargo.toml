[workspace]
resolver = "2"
members = ["crates/storm-replay", "crates/storm-stats", "crates/storm-codex-server", "crates/storm-replay-viewer", "crates/storm-lobby", "crates/storm-codex-supervisor"]
# The spikes (milestone 0, Rust front-end step 0) have their own lockfiles — they are not part of the workspace.
exclude = ["spike/storm-decode", "spike/frontend-rust"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/matella/storm-codex"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

# Perf budgets = contracts (CLAUDE.md): decoding is the server's hot path.
[profile.release]
lto = "thin"
codegen-units = 1
